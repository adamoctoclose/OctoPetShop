name: .NET Core 

on:
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set Version
      run: echo "PACKAGE_VERSION=$(date +'%Y.%m.%d').$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

    - name: Setup .NET 6
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '6.0.x'

    - name: Install dependencies
      run: dotnet restore ./OctopusSamples.OctoPetShop.Web/OctopusSamples.OctoPetShop.Web.csproj

    - name: Build
      run: dotnet build ./OctopusSamples.OctoPetShop.Web/OctopusSamples.OctoPetShop.Web.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish OctopusSamples.OctoPetShop.Web/OctopusSamples.OctoPetShop.Web.csproj --configuration Release --no-restore --output "$GITHUB_WORKSPACE/artifacts/OctopusSamples.OctoPetShop.Web"

    - name: Create NuGet Package
      run: |
        dotnet pack ./OctopusSamples.OctoPetShop.Web/OctopusSamples.OctoPetShop.Web.csproj --configuration Release --output "$GITHUB_WORKSPACE/artifacts" /p:PackageVersion=${{ env.PACKAGE_VERSION }}

        - name: Install JFrog CLI
        run: curl -fL https://getcli.jfrog.io | sh && chmod +x jfrog
    
    - name: Configure JFrog CLI
      run: |
          ./jfrog rt config --url=${{ secrets.ARTIFACTORY_URL }} \
                            --user=${{ secrets.ARTIFACTORY_USERNAME }} \
                            --password=${{ secrets.ARTIFACTORY_PASSWORD }}
    
    - name: Upload NuGet Package to Artifactory
      run: ./jfrog rt u "$GITHUB_WORKSPACE/artifacts/*.nupkg" demo-adam-octopetshop
          